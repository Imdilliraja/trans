<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – Tranquilhomes</title>
    <link rel="icon" href="assets/images/logos/Tranquil-Small-150x150.png" sizes="32x32">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">

<div class="admin-login-wrapper">
    <div class="admin-login-card">
        <div class="admin-login-header">
            <img src="assets/images/logos/Tranquil-logo-new1.png" alt="Tranquil Homes" class="admin-login-logo">
            <h2>Admin Panel</h2>
            <p>Sign in to manage your property</p>
        </div>
        <form class="admin-login-form" id="adminLoginForm">
            <div class="admin-form-group">
                <label for="userId"><i class="fas fa-user"></i> User ID</label>
                <input type="text" id="userId" placeholder="Enter User ID" required autocomplete="off">
            </div>
            <div class="admin-form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <div class="password-field">
                    <input type="password" id="password" placeholder="Enter Password" required>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="admin-form-group remember-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
            </div>
            <button type="submit" class="admin-login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
            <div class="admin-login-error" id="loginError">
                <i class="fas fa-exclamation-circle"></i> Invalid User ID or Password
            </div>
        </form>
        <div class="admin-login-footer">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
        </div>
    </div>
</div>

<script src="admin.js"></script>
</body>
</html>
